name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: rust
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Toolchain (pinned by rust-toolchain.toml)
        run: rustup show active-toolchain && rustup component add rustfmt clippy
      - name: Format
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - name: Test
        run: cargo test --locked

  rust-db:
    name: rust-db
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgres://postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v6
      - name: Toolchain (pinned by rust-toolchain.toml)
        run: rustup show active-toolchain
      - name: Family-mode tests against PostgreSQL
        run: cargo test --locked --features db-tests

  browser-js:
    name: browser-js
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.22.2
      - name: Device profile parity with michi
        run: node --test "web/test/**/*.test.mjs"

  container:
    name: container
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - name: Build image (the same Dockerfile Railway uses)
        run: docker build -t hongjia-web .
      - name: Run and check the container
        run: |
          docker run -d --name web -e PORT=3000 -e RAILWAY_GIT_COMMIT_SHA="$GITHUB_SHA" -p 3000:3000 -p 8080:8080 hongjia-web
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:3000/healthz && break; sleep 1; done
          curl -fsS http://127.0.0.1:3000/healthz | grep -q '"status":"ok"'
          curl -fsS http://127.0.0.1:8080/healthz | grep -q "${GITHUB_SHA::7}"
          curl -fsSI http://127.0.0.1:3000/ | grep -qi '^content-security-policy:'
          test "$(docker inspect --format '{{.Config.User}}' hongjia-web)" = "65532:65532"
          size=$(docker image inspect --format '{{.Size}}' hongjia-web)
          echo "image size: $size bytes"
          test "$size" -lt 60000000
      - name: Container logs on failure
        if: failure()
        run: docker logs web || true
