[package]
name = "hongjia-web"
version = "0.2.0"
description = "hongjia.org web server"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Integration tests that need a PostgreSQL server (DATABASE_URL). Off in the container build.
db-tests = []

[dependencies]
argon2 = { version = "0.6.0", default-features = false, features = ["alloc"] }
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "form"] }
getrandom = "0.4.3"
hmac = "0.13.0"
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.11.1"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-none", "postgres", "migrate", "macros", "derive"] }
subtle = "2.6.1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["io-util"] }
